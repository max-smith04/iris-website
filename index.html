  <!-- window contents live here until a window is opened -->
  <template id="tpl-iris">
    <div class="doc">
      <div class="hero">
        <h1 class="wordmark">IRIS</h1>
        <p class="sub">Silver &middot; 2022 &middot; Suzuki Swift GL</p>
      </div>
      <p class="lead">Hello. I&rsquo;m Iris.</p>
      <p>I am one and a bit tonnes of quietly confident silver hatchback, and this is my desktop. I do the school run, the mountain pass, the 11&nbsp;p.m. milk run, and the long empty stretch of the N7 where the radio goes to static and nobody minds.</p>
      <p>Have a poke around. There&rsquo;s a folder about me, and a page where you can tell me what you really think &mdash; be gentle, I have feelings and a slightly noisy wheel bearing.</p>
      <div class="quickbar">
        <button class="xp-btn" data-open="pics">My Pictures</button>
        <button class="xp-btn" data-open="about">Open &ldquo;About Me&rdquo;</button>
        <button class="xp-btn" data-open="rate">Rate me &rarr;</button>
      </div>
    </div>
  </template>

  <template id="tpl-about">
    <div class="doc">
      <h2>About me</h2>
      <p>I came out of a showroom in Cape Town wearing a red ribbon the size of a small sail, which is a lot of ceremony for a car whose whole personality is <em>being reasonable</em>. I have never really recovered from the attention.</p>
      <p>Here is the honest version. I am not fast. I make an eager little noise around four thousand revs and it means nothing. What I <em>am</em> is light, and light is its own kind of quick &mdash; through Sir Lowry&rsquo;s, down a dirt track in the Cederberg, into a parking bay that everyone else drove past. I turn in like I&rsquo;ve been asked a favour rather than given an order.</p>
      <p>I sip. A tank lasts long enough that filling up feels like an occasion. I have carried four adults, one Christmas tree, an unreasonable amount of camping equipment, and at least one person who cried in my passenger seat and asked me not to tell anyone. I haven&rsquo;t.</p>
      <p>My flaws, since you&rsquo;ll find them anyway: I hum on coarse tar. My boot is more of a suggestion. There is a scuff on my rear arch that we do not discuss. And when it&rsquo;s properly cold I take a moment to think about it before I go.</p>
      <p>But I start. Every time. In eight hundred-odd mornings I have never once made anyone late.</p>

      <h3>Properties</h3>
      <table class="props">
        <tr><th scope="row">Name</th><td>Iris</td></tr>
        <tr><th scope="row">Model</th><td>Suzuki Swift GL</td></tr>
        <tr><th scope="row">Year</th><td>2022</td></tr>
        <tr><th scope="row">Colour</th><td>Silver (the one that hides dust)</td></tr>
        <tr><th scope="row">Engine</th><td>1.2&nbsp;litre, four cylinders, entirely sufficient</td></tr>
        <tr><th scope="row">Home</th><td>Cape Town, South Africa</td></tr>
        <tr><th scope="row">Favourite road</th><td>Anything with a mountain on one side</td></tr>
        <tr><th scope="row">Top speed</th><td>Classified. Downhill.</td></tr>
      </table>
      <div class="quickbar"><button class="xp-btn" data-open="rate">So &mdash; how did I do?</button></div>
    </div>
  </template>

  <template id="tpl-rate">
    <div class="doc">
      <h2>Rate me</h2>
      <p class="muted">Stars are compulsory, a name is compulsory, honesty is optional but appreciated.</p>

      <form id="rate-form" class="xp-group" novalidate>
        <fieldset class="stars-field">
          <legend>Out of five</legend>
          <div id="stars" class="stars" role="radiogroup" aria-label="Rating out of five stars">
            <button type="button" class="star" data-v="1" role="radio" aria-checked="false" aria-label="1 star"></button>
            <button type="button" class="star" data-v="2" role="radio" aria-checked="false" aria-label="2 stars"></button>
            <button type="button" class="star" data-v="3" role="radio" aria-checked="false" aria-label="3 stars"></button>
            <button type="button" class="star" data-v="4" role="radio" aria-checked="false" aria-label="4 stars"></button>
            <button type="button" class="star" data-v="5" role="radio" aria-checked="false" aria-label="5 stars"></button>
            <span id="stars-word" class="stars-word">no stars yet</span>
          </div>
        </fieldset>

        <label class="fld">
          <span>The good bits &amp; the bad bits <em>(optional)</em></span>
          <textarea id="rate-comment" rows="4" maxlength="500" placeholder="Go on."></textarea>
          <span class="counter"><span id="cc">0</span>/500</span>
        </label>

        <label class="fld">
          <span>Your name</span>
          <input id="rate-name" type="text" maxlength="40" autocomplete="name" placeholder="Who's asking?">
        </label>

        <div class="form-actions">
          <button type="submit" class="xp-btn primary" id="rate-submit">Submit</button>
          <button type="reset"  class="xp-btn" id="rate-reset">Clear</button>
          <span id="rate-status" class="rate-status" role="status"></span>
        </div>
      </form>

      <div id="ratings-panel" class="xp-group results">
        <div class="results-head">
          <h3>What everyone thinks</h3>
          <button type="button" class="xp-btn small" id="rate-refresh">Refresh</button>
        </div>
        <div id="avg" class="avg"></div>
        <ul id="rating-list" class="rating-list"></ul>
      </div>
    </div>
  </template>

------------------------------------------
